name: Update podcast feed

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh local podcast data
        run: node scripts/update-podcast-feed.mjs
      - name: Commit feed changes
        run: |
          if git diff --quiet -- data/podcast.json; then
            echo "Podcast feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcast.json
          git commit -m "Update podcast feed"
          git push
